name: Deploy to GitHub Pages

# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾼 뒤에 동작한다.
#
# ⚠ 전제: GitHub Pages 는 무료 요금제에서 **public 저장소만** 호스팅한다.
#    이 저장소를 public 으로 바꾸면 커밋 이력 전체가 공개된다.
#    공개 전환 전에 반드시 docs/배포.md §2 의 점검 항목을 확인할 것.

on:
  push:
    # 콘텐츠 사업 전환 브랜치를 현재 프로덕션 소스로 사용한다.
    # main 으로 되돌릴 때는 이 목록에서 해당 브랜치를 제거한다.
    branches: [main, codex/content-business-positioning]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 실행을 취소하지 않고 큐에 넣는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages 설정을 먼저 읽어 실제 배포 URL(base_url)을 확보한다.
      # 빌드가 사이트맵·canonical 에 그 값을 써야 하므로 순서가 중요하다.
      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run format:check && npm run lint && npm run typecheck && npm test

      - name: Build
        env:
          # 프로젝트 사이트는 /<repo> 하위에 놓인다.
          # 사용자 사이트(<user>.github.io)로 옮기면 BASE_PATH 를 비운다.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
